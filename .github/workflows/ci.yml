# Builds and tests the three packages on every push and pull request. A tag `v<version>` also
# publishes them at that version to npm, by trusted publishing (OIDC, no token) with provenance; each
# package's trusted publisher on npmjs.com names this workflow.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The toolchain rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The build tools in the versions build.sh requires: wasm-bindgen-cli as Cargo.lock pins the
      # crate, cargo-about as build.sh pins it.
      - id: versions
        run: |
          source scripts/toolchain.sh
          echo "wasm-bindgen=$(locked_version wasm-bindgen)" >> "$GITHUB_OUTPUT"
          echo "cargo-about=$(sed -n 's/^cargo_about=//p' build.sh)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: wasm-bindgen@${{ steps.versions.outputs.wasm-bindgen }},cargo-about@${{ steps.versions.outputs.cargo-about }}

      # wasm-opt, and the typst program the CLI package's tests compare against.
      - name: Install binaryen and typst
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          curl -sSfL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - run: ./build.sh
      - run: npm ci
      # The committed declarations of the CLI package have to be the ones this build generated.
      - run: git diff --exit-code packages/typst-cli/index.d.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # krilla's tests reach fontconfig through a dev-dependency, which Linux has to provide.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - run: cargo test --locked --manifest-path vendor/krilla/Cargo.toml --target-dir target/krilla-tests --lib object_streams

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typst-wasm
          path: pkg/
          if-no-files-found: error

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: typst-wasm
          path: pkg/
      # Node 24 brings npm 11.5.1 or newer, which trusted publishing needs.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The three packages are released together, at the version the tag names.
      - name: Check the versions against the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          wasm=$(node -p "require('./pkg/package.json').version")
          cli=$(node -p "require('./packages/typst-cli/package.json').version")
          fields=$(node -p "require('./packages/typst-fields/package.json').version")
          if [[ "$wasm" != "$tag" || "$cli" != "$tag" || "$fields" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME, but @jsfi/typst-wasm is $wasm, @jsfi/typst-cli is $cli and @jsfi/typst-fields is $fields." >&2
            exit 1
          fi

      # npm sets up trusted publishing only for a package that exists, so each package's first version
      # is published by hand. A tag before that would publish the others and then fail, so it stops
      # here, before anything is published.
      - name: Check that every package is on npm
        run: |
          for package in @jsfi/typst-wasm @jsfi/typst-cli @jsfi/typst-fields; do
            if ! output=$(npm view "$package" name 2>&1); then
              if grep -q E404 <<< "$output"; then
                echo "$package is not on npm yet: publish its first version by hand, as CONTRIBUTING.md says." >&2
              else
                echo "$output" >&2
              fi
              exit 1
            fi
          done

      # A pre-release goes to the dist-tag its identifier names, `0.2.0-beta.1` to `beta`, which npm
      # requires; a release goes to `latest`.
      - name: Choose the dist-tag
        id: dist-tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease="${version#*-}"
          if [[ "$version" == *-* ]]; then tag="${prerelease%%.*}"; else tag=latest; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm publish ./pkg --provenance --tag "${{ steps.dist-tag.outputs.tag }}"
      - run: npm publish ./packages/typst-cli --provenance --tag "${{ steps.dist-tag.outputs.tag }}"
      - run: npm publish ./packages/typst-fields --provenance --tag "${{ steps.dist-tag.outputs.tag }}"
